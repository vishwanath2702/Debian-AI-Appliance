#!/bin/bash
#
# ==========================================================
# DAIA - Debian AI Assistant
#
# File       : payload/config/pragna.conf
# Purpose    : Define the DAIA 1.0 Pragna build configuration.
#
# Version    : 1.0.0
# Codename   : Pragna
# License    : GPL-3.0
#
# Responsibilities
# ----------------
# - Define distribution identity.
# - Define desktop and architecture settings.
# - Enable or disable bundled components.
# - Define payload source locations.
# - Define default feature flags.
#
# Dependencies
# ------------
# None.
#
# Outputs
# -------
# Variables consumed by build/load-config.sh.
#
# Failure Modes
# -------------
# This file performs no validation. Validation is handled by
# build/load-config.sh.
#
# Future Extension
# ----------------
# Add new build-time settings under the relevant section.
# ==========================================================

# This file is intentionally sourced by other scripts.
# Its variables are not consumed within this file itself.
# shellcheck disable=SC2034

############################################################
#
# Sections
#
#   1. Distribution
#   2. Desktop
#   3. Components
#   4. Payload Paths
#   5. Features
#   6. Branding
#
############################################################

############################################################
# 1. Distribution
############################################################

DAIA_NAME="DAIA"
DAIA_FULL_NAME="Debian AI Assistant"
DAIA_VERSION="1.0.0"
DAIA_CODENAME="Pragna"
DAIA_EDITION="community"

DAIA_ARCHITECTURE="amd64"
DAIA_BASE_DISTRIBUTION="debian"
DAIA_BASE_VERSION="13"

############################################################
# 2. Desktop
############################################################

DAIA_DESKTOP_ENABLED="true"
DAIA_DESKTOP_ENVIRONMENT="kde"

############################################################
# 3. Components
############################################################

DAIA_ENABLE_DOCKER="true"
DAIA_ENABLE_OLLAMA="true"
DAIA_ENABLE_OPEN_WEBUI="true"
DAIA_ENABLE_PGVECTOR="true"
DAIA_ENABLE_DEFAULT_MODEL="false"

############################################################
# 4. Payload Paths
############################################################

DAIA_DOCKER_SOURCE="payload/packages/docker"
DAIA_OLLAMA_SOURCE="payload/packages/ollama"
DAIA_DEPENDENCIES_SOURCE="payload/packages/dependencies"

DAIA_OPEN_WEBUI_IMAGE="payload/images/open-webui-v0.13.0-slim.tar"
DAIA_OPEN_WEBUI_IMAGE_REF="ghcr.io/open-webui/open-webui:v0.13.0-slim"
DAIA_PGVECTOR_IMAGE="payload/images/pgvector-pg17.tar"
DAIA_PGVECTOR_IMAGE_REF="pgvector/pgvector:pg17"
DAIA_PGVECTOR_DOCKER_IMAGE_ID="sha256:366e1863bdeefd735562caf0ebb4c8b05b4cb37bd8eec60d516c9083209746a2"
# Trusted OCI digest; required for future registry acquisition.
DAIA_PGVECTOR_IMAGE_DIGEST="sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8"
# Independently approved SHA-256 of the completed offline archive.
DAIA_PGVECTOR_ARCHIVE_SHA256="5d903322c843abad607f7fa9349b0b7a1c1a53c02b1306eada13451d2a367228"
DAIA_DEFAULT_MODEL_SOURCE="payload/models/default"

############################################################
# 5. Features
############################################################

DAIA_OFFLINE_INSTALL="true"
DAIA_FIRST_BOOT_SETUP="true"
DAIA_TELEMETRY_ENABLED="false"
DAIA_REMOTE_ACCESS_ENABLED="false"

############################################################
# 6. Branding
############################################################

DAIA_BRANDING_ENABLED="true"
DAIA_DEFAULT_WALLPAPER="payload/branding/wallpapers/daia-default.png"
DAIA_ASSISTANT_ICON="payload/branding/icons/daia-assistant.png"

############################################################
# End of File
############################################################
