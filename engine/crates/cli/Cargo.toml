[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "daia"
path = "src/main.rs"

[[bin]]
name = "daia-model-import"
path = "src/model_import_main.rs"

[[bin]]
name = "daia-model-export-worker"
path = "src/model_export_worker_main.rs"

[[bin]]
name = "daia-model-export-broker"
path = "src/model_export_broker_main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
rustix = { version = "=1.1.4", features = ["fs", "process"] }
application = { path = "../application" }
engine = { path = "../engine" }
facts = { path = "../facts" }
model = { path = "../model" }
registry = { path = "../registry" }
inspector = { path = "../inspector" }
state = { path = "../state" }
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
