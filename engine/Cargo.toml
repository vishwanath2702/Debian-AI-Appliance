[workspace]
resolver = "3"

members = [
    "crates/model",
    "crates/registry",
    "crates/resolver",
    "crates/planner",
    "crates/executor",
    "crates/inspector",
    "crates/engine",
    "crates/cli",

]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
