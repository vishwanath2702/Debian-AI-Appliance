[workspace]
resolver = "3"

members = [
    "crates/model",
    "crates/registry",
    "crates/resolver",
    "crates/planner",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
